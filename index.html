<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Card Accordion — BOGO UI</title>

    <style>
        /* vars */
        :root {
            --pink: #ff778f;
            --pink-600: #ff6b82;
            --muted: #9b9b9b;
            --border: #c8c8c8;
            --page-bg: #f8f5f6;
            --card-bg: #fff6f7;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            --radius: 10px;
            --gap: 18px;
            --maxw: 560px;
        }

        /* base layout */
        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: #fff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 36px 20px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            font-size: 15px;
            color: #222;
        }

        .wrap {
            width: 100%;
            max-width: var(--maxw)
        }

        /* header */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 22px
        }

        header::before,
        header::after {
            content: "";
            height: 2px;
            background: var(--border);
            flex: 1
        }

        header h1 {
            margin: 0;
            color: var(--pink-600);
            font-weight: 600;
            font-size: 20px
        }

        /* cards list */
        .cards {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin: 0;
            padding: 0;
            list-style: none
        }

        /* card */
        .card {
            position: relative;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all .25s ease;
            overflow: visible;
        }

        .card.popular {
            border-color: var(--pink-600);
            border-width: 2px;
            background: linear-gradient(180deg, var(--card-bg), #fff);
        }

        /* ribbon (precise) */
        .ribbon {
            position: absolute;
            right: 36px;
            top: -18px;
            /* overlaps card border */
            padding: 10px 36px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ff8a98, var(--pink-600));
            z-index: 60;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.06);
            line-height: 1;
        }


        /* mask: hide card border under diamond so it looks joined */
        .card.popular::after {
            content: "";
            position: absolute;
            right: calc(36px + 6px + 10px);
            /* aligns with ribbon left */
            top: -10px;
            width: 18px;
            height: 18px;
            transform: rotate(45deg);
            background: var(--page-bg);
            z-index: 58;
            border-radius: 1px;
            pointer-events: none;
        }

        /* card inner layout */
        .card-inner {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 16px
        }

        .choice {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer
        }

        .choice input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--pink-600);
            background: transparent;
            display: inline-block;
            position: relative;
            cursor: pointer;
        }

        .choice input[type="radio"]:checked {
            background: var(--pink-600);
            box-shadow: inset 0 0 0 3px #fff
        }

        .ms-2 {
            margin-left: 8px
        }

        .label {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .label__unit {
            font-weight: 700;
            font-size: 14px
        }

        .label__discount {
            display: inline-block;
            background: var(--pink-600);
            color: #fff;
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 400
        }

        .price__list {
            text-align: right
        }

        .price__lg {
            font-weight: 600;
            font-size: 14px
        }

        .price__small {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
            text-decoration: line-through
        }

        /* details collapsed */
        .details {
            margin-top: 14px;
            padding: 12px 0;
            display: none
        }

        .card.open .details {
            display: block
        }

        /* form details grid */
        .form-details {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            align-items: center;
            column-gap: 12px;
            margin-bottom: 8px;
            padding-left: 6px
        }

        .form-details p {
            margin: 0;
            font-weight: 600;
            text-align: center
        }

        .form-details__select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 13px
        }

        /* summary and button */
        .summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 2px;
            margin-top: 12px;
            color: var(--pink-600);
            font-weight: 700
        }

        .summary div:first-child {
            color: var(--pink-600)
        }

        .summary div:last-child,
        #total {
            color: #000;
            font-size: 14px;
            font-weight: 400
        }

        .btn-add {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            background: linear-gradient(180deg, var(--pink-600), var(--pink));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            box-shadow: var(--shadow);
            cursor: pointer
        }

        .btn-add .plus {
            font-weight: 900;
            font-size: 20px
        }

        .powered {
            font-size: 12px;
            color: #bdbdbd;
            margin-top: 8px;
            text-align: right
        }

        /* small responsive */
        @media (max-width:420px) {
            .card-inner {
                grid-template-columns: 1fr
            }

            .price__list {
                text-align: left;
                margin-top: 10px
            }

            .details {
                padding-left: 0
            }

            .ribbon {
                right: 18px;
                padding: 8px 24px;
                font-size: 13px;
                top: -16px
            }

            .ribbon::before {
                left: -14px;
                width: 14px;
                height: 14px
            }

            .ribbon::after {
                right: -6px;
                bottom: -6px;
                border-left: 10px solid transparent;
                border-top: 10px solid var(--pink-600)
            }
        }

        /* minimal helper */
        .mt-3 {
            margin-top: 12px
        }
    </style>
</head>

<body>
    <div class="wrap" id="app">
        <header>
            <h1>YAY! It's BOGO</h1>
        </header>

        <form class="cards" id="offers" aria-label="offers">
            <!-- card 1 -->
            <article class="card" data-id="1">
                <div class="card-inner">
                    <label class="choice" for="opt1">
                        <input type="radio" id="opt1" name="offer" value="1">
                        <div class="ms-2">
                            <div class="label">
                                <div class="label__unit">1 Unit</div>
                                <div class="label__discount">20% Off</div>
                            </div>
                            <div class="label__price">Standard Price</div>
                        </div>
                    </label>

                    <div class="price__list">
                        <div class="price__lg">$18.00 USD</div>
                        <div class="price__small">$24.00 USD</div>
                    </div>
                </div>

                <div class="details" aria-hidden="true">
                    <section>
                        <div class="form-details">
                            <p></p>
                            <p>Size</p>
                            <p>Colour</p>
                        </div>

                        <div class="form-details">
                            <p>#1</p>
                            <div><select name="size-1-1" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-1-1" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>

                        <div class="form-details">
                            <p>#2</p>
                            <div><select name="size-1-2" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-1-2" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>
                    </section>
                </div>
            </article>

            <!-- card 2 popular -->
            <article class="card popular" data-id="2">
                <div class="ribbon" role="note" aria-hidden="true">MOST POPULAR</div>

                <div class="card-inner">
                    <label class="choice" for="opt2">
                        <input type="radio" id="opt2" name="offer" value="2">
                        <div class="ms-2">
                            <div class="label">
                                <div class="label__unit">2 Unit</div>
                                <div class="label__discount">20% Off</div>
                            </div>
                        </div>
                    </label>

                    <div class="price__list">
                        <div class="price__lg">$18.00 USD</div>
                        <div class="price__small">$24.00 USD</div>
                    </div>
                </div>

                <div class="details" aria-hidden="true">
                    <section>
                        <div class="form-details">
                            <p></p>
                            <p>Size</p>
                            <p>Colour</p>
                        </div>

                        <div class="form-details">
                            <p>#1</p>
                            <div><select name="size-2-1" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-2-1" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>

                        <div class="form-details">
                            <p>#2</p>
                            <div><select name="size-2-2" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-2-2" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>
                    </section>
                </div>
            </article>

            <!-- card 3 -->
            <article class="card" data-id="3">
                <div class="card-inner">
                    <label class="choice" for="opt3">
                        <input type="radio" id="opt3" name="offer" value="3">
                        <div class="ms-2">
                            <div class="label">
                                <div class="label__unit">3 Unit</div>
                                <div class="label__discount">30% Off</div>
                            </div>
                        </div>
                    </label>

                    <div class="price__list">
                        <div class="price__lg">$24.00 USD</div>
                        <div class="price__small">$24.00 USD</div>
                    </div>
                </div>

                <div class="details" aria-hidden="true">
                    <section>
                        <div class="form-details">
                            <p></p>
                            <p>Size</p>
                            <p>Colour</p>
                        </div>

                        <div class="form-details">
                            <p>#1</p>
                            <div><select name="size-3-1" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-3-1" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>

                        <div class="form-details">
                            <p>#2</p>
                            <div><select name="size-3-2" class="form-details__select">
                                    <option>S</option>
                                    <option>M</option>
                                    <option>L</option>
                                </select></div>
                            <div><select name="color-3-2" class="form-details__select">
                                    <option>Black</option>
                                    <option>Yellow</option>
                                    <option>Blue</option>
                                </select></div>
                        </div>
                    </section>
                </div>
            </article>

            <div class="summary">
                <div>Free Delivery</div>
                <div>Total: <strong id="total">$18.00 USD</strong></div>
            </div>
        </form>

        <div class="mt-3">
            <button class="btn-add" id="addToCart" type="button"><span class="plus">+</span> Add to Cart</button>
            <div class="powered">@ Powered by Pumper</div>
        </div>
    </div>

    <script>
        /* behavior */
        (function () {
            "use strict";

            const pricing = {
                "1": "$10.00 USD",
                "2": "$18.00 USD",
                "3": "$24.00 USD"
            };

            const form = document.getElementById("offers");
            const cards = Array.from(document.querySelectorAll(".card"));
            const totalEl = document.getElementById("total");

            function updateOpenCard(selectedId) {
                cards.forEach(card => {
                    const isMatch = card.dataset.id === selectedId;
                    card.classList.toggle("open", isMatch);
                    const details = card.querySelector(".details");
                    if (details) details.setAttribute("aria-hidden", String(!isMatch));
                });
            }

            function updateTotal(selectedId) {
                totalEl.textContent = pricing[selectedId] || totalEl.textContent;
            }

            // initial total based on checked radio (fallback to 2)
            document.addEventListener("DOMContentLoaded", function () {
                const checked = form.querySelector('input[name="offer"]:checked');
                const initial = checked ? checked.value : "2";
                // mark initial UI - do not change user's selection
                updateOpenCard(initial);
                updateTotal(initial);
                // set radio if none checked to match initial total visually
                if (!checked) {
                    const defaultRadio = form.querySelector('input[name="offer"][value="2"]');
                    if (defaultRadio) defaultRadio.checked = true;
                }
            });
   // delegate change events
            form.addEventListener("change", function (evt) {
                const target = evt.target;
                if (target && target.name === "offer") {
                    const selectedId = target.value;
                    updateOpenCard(selectedId);
                    updateTotal(selectedId);
                }
            });

            // keep add to cart stub functional (no behavior change)
            const addBtn = document.getElementById("addToCart");
            addBtn.addEventListener("click", function () {
                // minimal: reflect current total in console
                console.log("Add to cart clicked — total:", totalEl.textContent);
            });
        })();
    </script>
</body>

</html>
